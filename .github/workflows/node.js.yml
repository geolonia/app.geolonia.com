name: Node.js CI

on:
  push:
    branches:
      - master
      - develop
    tags:
      - '*'
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    # PR のコードを checkout して実行するジョブなので、書き込み権限は与えない
    permissions:
      contents: read

    outputs:
      bundle_size_report: ${{ steps.compare_bundle_size.outputs.report }}

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v3
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache the built for react-scripts
        uses: actions/cache@v3
        with:
          path: ./build
          key: build-assets-${{ github.sha }}
          restore-keys: |
            build-assets-${{ github.event.pull_request.base.sha }}

      - run: yarn
      - run: yarn run validate:jed
      - run: yarn test
        env:
         REACT_APP_COGNITO_USERPOOL_ID: us-east-1_000000000
         REACT_APP_COGNITO_APP_CLIENT_ID: 0000000000000aaaaaaaaaaaaa
      - run: yarn run lint

      - run: "mkdir -p build && cp -r build build_prev"
      - run: yarn build

      - id: compare_bundle_size
        # 複数行の値は heredoc 形式で渡す
        # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands#multiline-strings
        run: |
          REPORT="$(node bin/compare.js)"
          {
            echo 'report<<GEOLONIA_REPORT_EOF'
            printf '%s\n' "$REPORT"
            echo 'GEOLONIA_REPORT_EOF'
          } >> "$GITHUB_OUTPUT"

  # コメント投稿だけを、PR のコードを一切実行しない別ジョブに分離する。
  # Dependabot が起動した workflow の GITHUB_TOKEN は既定で read-only になるため、
  # 投稿に必要な権限をこのジョブにのみ与える。
  comment:
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.event_name == 'pull_request' &&
      contains(github.actor, 'dependabot')

    permissions:
      pull-requests: write

    steps:
      - name: Post comment
        uses: actions/github-script@v9
        env:
          POSTING_COMMENT_BODY: ${{ needs.build.outputs.bundle_size_report }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { issue: { number: issue_number }, repo: { owner, repo }  } = context;
            await github.rest.issues.createComment({
              issue_number,
              owner,
              repo,
              body: process.env.POSTING_COMMENT_BODY,
            });
